[package]
name = "lt-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
claxon = "0.4.3"
encoding_rs = "0.8.42"
flacenc = "0.5.1"
hound = "3.5.1"
lofty = "0.25.4"
md-5 = "0.10.6"
plist = "1.10.1"
quick-xml = "0.42.0"
base64 = "0.22.1"
mime_guess = "2.0.5"
reqwest = { version = "0.13.5", features = ["blocking", "json", "multipart"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1_smol = "1.0.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
