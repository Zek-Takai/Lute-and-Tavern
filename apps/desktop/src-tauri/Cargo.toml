[package]
license.workspace = true
name = "lute-and-tavern"
version = "0.1.0"
edition = "2024"
description = "Lute & Tavern: your music library, an AI songwriter and sheet music in one app"

[lib]
name = "lute_and_tavern_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
base64 = "0.22.1"
getrandom = "0.3.4"
jsonwebtoken = { version = "11.1.0", features = ["use_pem", "rust_crypto"] }
keyring = "4.2.0"
md-5 = "0.10.6"
lt-core = { path = "../../../crates/lt-core" }
mime_guess = "2.0.5"
notify = "8.2.0"
notify-debouncer-mini = "0.7.0"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["blocking"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-deep-link = "2.5.0"
tauri-plugin-dialog = "2.8.0"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2.5.0", features = ["deep-link"] }
tauri-plugin-updater = "2.13.0"
tiny_http = "0.12.0"
url = "2.5.8"

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dev-dependencies]
ring = "0.17"
base64 = "0.22"
